[phases.setup]
nixPkgs = ["php83", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.tokenizer", "php83Extensions.pdo", "php83Extensions.pdo_mysql", "php83Extensions.curl", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.intl", "php83Extensions.fileinfo", "composer"]

[phases.install]
cmds = ["cd core && composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "cd core && php artisan config:cache",
  "cd core && php artisan route:cache",
  "cd core && php artisan view:cache"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t . index.php"
